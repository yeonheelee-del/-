[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-auto-edit"
version = "0.1.0"
description = "프리미어 프로 자동 편집 도구 — 무음 삭제, 음량 밸런스, 컷 편집, 자막 생성"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
premiere-auto-edit = "premiere_auto_edit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
